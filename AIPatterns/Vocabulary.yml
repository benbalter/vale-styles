extends: existence
message: "'%s' is a word AI overuses. Consider a plainer, more specific alternative."
link: https://github.com/benbalter/vale-styles/blob/master/AIPatterns/Vocabulary.yml
ignorecase: true
level: warning
# Only tells that are essentially absent from 15 years of Ben's posts live here.
# Words he genuinely uses (empower, foster, facilitate, robust, comprehensive,
# harness, navigate, crucial, actionable, showcase, seamless, embark, reimagine,
# vibrant, impactful, endeavor) are deliberately omitted — flagging his own voice
# would just be noise. See PlainWords.yml for the 1:1 swaps. Words with a
# suggested replacement (tapestry, myriad, holistic, ...) live in
# BenBalter.Buzzwords, so one word raises one alert.
tokens:
  - delve
  - '(?<!in the )realm'
  - 'paradigm(?! shift)'
  - beacon
  - meticulous(ly)?
  - game-changing
  - watershed moment
  - nestled
  - bustling
  - intricate
  - intricacies
  - ever-evolving
  - learnings
  - thought leader(ship)?
  - interplay
  - symphony
  - quintessential
  - multifaceted
  - burgeoning
  - nascent
  - paramount
  - galvanize
  - catalyze
  - elucidate
  - juxtapose
  - spearhead
  - bolster
  - overarching
  - poised to
