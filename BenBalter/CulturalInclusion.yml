extends: substitution
message: 'Use inclusive language. Consider "%s" instead of "%s".'
link: https://github.com/benbalter/vale-styles/blob/master/BenBalter/CulturalInclusion.yml
ignorecase: true
level: warning
action:
  name: replace
swap:
  black\s?list\s?(?:ed)?: denylist
  white\s?list\s?(?:ed)?: allowlist
  sanity[- ]checking: spot-checking
  sanity[- ]checks: quick checks, spot-checks
  sanity[- ]check: quick check, spot-check
  brown bag session: lunch and learn
  redline(?:ing)?: markup
  rule of thumb: standard, principle
  # The branch or replication sense only, so the verb ("teams that master
  # async") and "master's degree" stay quiet.
  'master(?=[ /-](?:branch|node|copy|database|db|server|list|repo|repository|slave|replica|key)\b)': primary, main
  '(?<=\b(?:to|into|from|onto|off) )master(?=[.,;:)!?]|$)': primary, main
  slave: replica
  dummy: placeholder
  backlog grooming: backlog refinement
  hey guys: hey folks, hey everyone
  hi guys: hi folks, hi everyone
  you guys: you all, folks
