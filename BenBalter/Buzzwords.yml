  leveraging: "Use 'using', 'applying', or 'building on'"
  leveraged: "Use 'used', 'applied', or 'built on'"
  synergy: "Use 'collaboration' or 'combined effect'"
  synergies: "Use 'collaborations' or 'combined effects'"
