extends: existence
message: 'Use a comma before the last "and" or "or" in a list of three or more items.'
link: https://github.com/benbalter/vale-styles/blob/master/BenBalter/OxfordComma.yml
level: warning
raw:
  # Fixed pairs ("express or implied", "virtual or otherwise") aren't lists.
  - '(?:[^\s,]+,){1,} (?!express or implied\b)\w+ (?:and|or) (?!otherwise\b)\w+[.?!]'
