extends: existence
message: "'%s' doesn't need a hyphen."
level: warning
ignorecase: false
nonword: true
action:
  name: edit
  params:
    - replace
    - "-"
    - " "
# Words ending in -ly that are adjectives, not adverbs, so a compound
# modifier built on one keeps its hyphen ("family-owned", "early-stage").
tokens:
  - '\s(?!(?:family|early|daily|weekly|monthly|quarterly|yearly|hourly|nightly|friendly|elderly|costly|curly|deadly|holy|lonely|lovely|orderly|silly|timely|ugly)-)[^\s-]+ly-'
