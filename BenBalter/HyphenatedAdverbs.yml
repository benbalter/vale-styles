extends: existence
message: "'%s' doesn't need a hyphen."
link: https://github.com/benbalter/vale-styles/blob/main/BenBalter/HyphenatedAdverbs.yml
level: warning
ignorecase: false
nonword: true
action:
  name: edit
  params:
    - replace
    - "-"
    - " "
# Words ending in -ly that are adjectives ("family-owned", "early-stage") or
# nouns ("fly-fishing", "assembly-line"), not adverbs, so a compound built on
# one keeps its hyphen. The lookbehind replaces a leading \s so the word still
# matches after punctuation ("(early-stage", "*early-stage*").
tokens:
  - '(?<![\w-])(?!(?i:family|early|daily|weekly|monthly|quarterly|yearly|hourly|nightly|friendly|elderly|costly|curly|deadly|holy|lonely|lovely|orderly|silly|timely|ugly|fly|assembly|supply|ally|rally|reply|belly|bully|jelly|holly|lily|italy|july)-)\w+ly-'
