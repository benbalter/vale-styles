# Shared voice calls for the third-party packages Ben's repos load alongside
# BenBalter and AIPatterns. Each rule below flags a deliberate choice in Ben's
# voice, or duplicates a curated BenBalter rule, so it's off everywhere.
#
# Consumers list this package in Packages; Vale reads it before their own
# .vale.ini, so any repo can turn a rule back on. It doesn't load styles:
# turning off a rule from a package a repo doesn't use is a no-op.

[*]
# Voice choices, not defects.
write-good.E-Prime = NO   # bans every "to be"
write-good.Passive = NO   # passive is sometimes the right voice
write-good.TooWordy = NO
write-good.So = NO        # sentence-opening "So" is voice; BenBalter.So covers misuse
proselint.But = NO        # sentence-opening "But" is voice; BenBalter.But covers misuse

# Duplicates of curated BenBalter rules.
write-good.Cliches = NO   # BenBalter.Cliches
proselint.Cliches = NO    # BenBalter.Cliches
proselint.CorporateSpeak = NO  # BenBalter.CorporateSpeak
